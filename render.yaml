services:
  - type: web
    name: snapnote-api
    env: docker
    repo: https://github.com/sanrishi/SnapNote-AI
    # No branch pin: service PR previews build the PR's branch, not master.
    # Production deploys from the repo default branch (master) — unchanged.
    previews:
      generation: automatic
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: credits-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CREDITS_DB_PATH
        value: /data/credits.db
      - key: APP_NAME
        value: SnapNote AI
      - key: DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_MODEL
        value: sana
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 112530923487-6kjt4rvk765lekhd55fpeeu5fg1dh49e.apps.googleusercontent.com
      - key: ANONYMOUS_FREE_USES
        value: 1
